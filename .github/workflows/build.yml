name: Build Winlator cmod (fps fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (source split volumes)
        uses: actions/checkout@v4

      - name: Extract source (7z multi-volume)
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          7z x -y "Winlator-Ludashi-4.1.7z.001"
          ls -la
          PROJ=$(dirname "$(find . -maxdepth 4 -name settings.gradle -print -quit)")
          echo "PROJ=$PROJ" >> $GITHUB_ENV
          echo "Project root: $PROJ"

      - name: Force Gradle wrapper 8.10.2 (AGP 8.8 requirement)
        run: |
          WRAP="$PROJ/gradle/wrapper/gradle-wrapper.properties"
          sed -i -E 's#gradle-[0-9.]+-(bin|all)\.zip#gradle-8.10.2-bin.zip#' "$WRAP"
          cat "$WRAP"

      - name: "[DIAGNOSTIC] Force render cap to 60 FPS"
        run: |
          F="$PROJ/app/src/main/cpp/winlator/renderer/vulkan/VulkanRendererContext.cpp"
          sed -i 's/std::chrono::microseconds(6900)/std::chrono::microseconds(16666)/' "$F"
          grep -n "minFrameInterval" "$F" || true

      - name: Clone libadrenotools
        run: |
          rm -rf "$PROJ/app/src/main/cpp/adrenotools"
          git clone https://github.com/Pipetto-crypto/libadrenotools.git "$PROJ/app/src/main/cpp/adrenotools"
          cd "$PROJ/app/src/main/cpp/adrenotools"
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass
        run: |
          mkdir -p "$PROJ/app/src/main/cpp/adrenotools/lib"
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git "$PROJ/app/src/main/cpp/adrenotools/lib/linkernsbypass"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install build dependencies (incl. NDK 29)
        run: |
          sudo apt-get install -y glslang-tools ninja-build zstd
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;29.0.14206865" > /dev/null 2>&1 || true
          sdkmanager --list_installed | grep -i "ndk" || true

      - name: Build with Gradle
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-cmod-fpsfix
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
